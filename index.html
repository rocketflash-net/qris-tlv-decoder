<style>
:root{
  --paper:#f6f7fb; --surface:#ffffff; --ink:#151a28; --slate:#5a6275; --line:#e1e4ee;
  --cobalt:#2b45d4; --cobalt-wash:#eaedfc;
  --code-bg:#151a28; --code-ink:#d9def0; --code-key:#9db0ff; --code-num:#ffc58a; --code-dim:#6d7591; --code-sub:#9be3b8;
  --ok:#1f9d63; --ok-wash:#e3f6ec; --warn:#b26a00; --warn-wash:#fff3dc; --err:#c8323c; --err-wash:#fde8ea;
  --max:68rem; --gutter:clamp(1rem,4vw,2.5rem);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0d1220; --surface:#131a2c; --ink:#e7eaf3; --slate:#98a0b6; --line:#232b42;
    --cobalt:#8fa2ff; --cobalt-wash:#1a2246; --code-bg:#070a14;
    --ok:#3ccf8e; --ok-wash:#0f2a20; --warn:#ffb547; --warn-wash:#2c2210; --err:#ff6b74; --err-wash:#2e1418;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1220; --surface:#131a2c; --ink:#e7eaf3; --slate:#98a0b6; --line:#232b42;
  --cobalt:#8fa2ff; --cobalt-wash:#1a2246; --code-bg:#070a14;
  --ok:#3ccf8e; --ok-wash:#0f2a20; --warn:#ffb547; --warn-wash:#2c2210; --err:#ff6b74; --err-wash:#2e1418;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 1rem/1.6 "Schibsted Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--cobalt);text-underline-offset:3px}
a:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

.bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.25rem 0;font-size:.95rem}
.bar .home{color:var(--ink);text-decoration:none;font-weight:600}
.bar .right{display:flex;gap:.6rem;align-items:center}
.bar .right a{color:var(--slate);text-decoration:none;margin-right:.6rem}
.bar .right a:hover{color:var(--ink)}
.toggle{background:var(--surface);border:1px solid var(--line);color:var(--ink);height:2.1rem;min-width:2.1rem;border-radius:999px;cursor:pointer;font:inherit;font-size:.85rem}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{background:none;border:0;color:var(--slate);font:600 .8rem/1 "Schibsted Grotesk",sans-serif;padding:.6rem .7rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--cobalt);color:#fff}
:root[data-theme="dark"] .lang button[aria-pressed="true"]{color:#0d1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lang button[aria-pressed="true"]{color:#0d1220}}

header.top{padding:clamp(1.5rem,5vw,3.5rem) 0 clamp(1.5rem,4vw,2.25rem)}
h1{font-size:clamp(2.2rem,5.5vw,3.6rem);line-height:1.02;letter-spacing:-.035em;font-weight:800}
h1 span{color:var(--cobalt)}
.lede{color:var(--slate);margin-top:.9rem;max-width:40rem;font-size:1.06rem}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.input{padding:1rem}
.input label{display:block;font-weight:600;font-size:.92rem;margin:0 0 .5rem .2rem}
textarea{width:100%;min-height:7.5rem;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:400 .9rem/1.6 "IBM Plex Mono",ui-monospace,monospace;padding:.8rem .9rem;word-break:break-all}
textarea:focus{border-color:var(--cobalt)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-top:.75rem}
.btn{display:inline-flex;align-items:center;padding:.55rem 1rem;border-radius:8px;font:600 .9rem/1.2 "Schibsted Grotesk",sans-serif;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--surface);cursor:pointer}
.btn:hover{border-color:var(--cobalt)}
.btn.solid{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
:root[data-theme="dark"] .btn.solid{color:#0d1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.solid{color:#0d1220}}
.status{margin-left:auto;display:inline-flex;align-items:center;gap:.45rem;font-weight:600;font-size:.9rem;padding:.4rem .8rem;border-radius:999px}
.status::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:currentColor}
.status.ok{color:var(--ok);background:var(--ok-wash)}
.status.err{color:var(--err);background:var(--err-wash)}
.status.warn{color:var(--warn);background:var(--warn-wash)}
.status[hidden]{display:none}

#out[hidden]{display:none}
.summary{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:1.25rem}
.summary div{flex:1 1 10.5rem;background:var(--surface);padding:.85rem 1rem}
.summary dt{color:var(--slate);font-size:.8rem;font-weight:500}
.summary dd{font-weight:700;font-size:1.05rem;margin-top:.1rem;overflow-wrap:anywhere}

.raw{background:var(--code-bg);color:var(--code-ink);border-radius:14px;margin-top:1.25rem;overflow:hidden}
.raw-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 1rem;padding:.75rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.08);font-size:.8rem;color:var(--code-dim)}
.legend{display:flex;gap:1rem}
.legend i{display:inline-block;width:.6rem;height:.6rem;border-radius:2px;margin-right:.35rem;vertical-align:-.02rem}
.raw pre{padding:1rem 1.1rem 1.15rem;white-space:pre-wrap;word-break:break-all;font:400 .92rem/1.85 "IBM Plex Mono",ui-monospace,monospace}
.raw .t{color:var(--code-key);font-weight:500}
.raw .l{color:var(--code-num)}
.raw .sub>.t{color:var(--code-sub)}
.raw .seg{border-radius:3px;transition:background .12s}
.raw .seg.hl{background:rgba(157,176,255,.18)}
.raw .l.over{color:#ff8a92;text-decoration:underline wavy;text-underline-offset:4px}
.row .len small{display:block;color:var(--err);font-size:.75rem}
.raw .bad{color:#ff8a92;text-decoration:underline wavy;text-underline-offset:4px}

.grid2{display:grid;grid-template-columns:1fr 18rem;gap:1.25rem;margin-top:1.25rem;align-items:start}
h2{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;padding:1rem 1.1rem .85rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:1rem}
h2 .btn{padding:.35rem .7rem;font-size:.82rem}

.rows{list-style:none}
.row{display:grid;grid-template-columns:3.6rem minmax(0,1fr) minmax(0,1.1fr) 2.4rem;gap:.35rem 1rem;padding:.8rem 1.1rem;border-bottom:1px solid var(--line);align-items:baseline;transition:background .12s}
.row:last-child{border-bottom:0}
.row.hl{background:var(--cobalt-wash)}
.row .tag{font:500 .9rem "IBM Plex Mono",monospace;color:var(--cobalt)}
.row .name{font-weight:600;font-size:.95rem;line-height:1.35}
.row .desc{display:block;color:var(--slate);font-size:.86rem;line-height:1.45;margin-top:.2rem;font-weight:400}
.row .meaning{display:block;margin-top:.35rem;font-size:.86rem;color:var(--ink);font-weight:500;line-height:1.45}
.row .meaning::before{content:"→ ";color:var(--cobalt)}
.row .val{font:400 .88rem/1.5 "IBM Plex Mono",monospace;overflow-wrap:anywhere}
.row .len{font:400 .82rem "IBM Plex Mono",monospace;color:var(--slate);text-align:right}
.row.child{padding-left:calc(1.1rem + var(--d,1) * 1rem);background:color-mix(in srgb,var(--paper) 55%,transparent)}
.row.child.hl{background:var(--cobalt-wash)}
.row.child .tag{color:var(--slate)}
.row.child .tag b{color:var(--cobalt);font-weight:500}
.row.flag .val{color:var(--err)}
.thead{display:grid;grid-template-columns:3.6rem minmax(0,1fr) minmax(0,1.1fr) 2.4rem;gap:1rem;padding:.55rem 1.1rem;border-bottom:1px solid var(--line);font-size:.78rem;color:var(--slate);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.thead span:last-child{text-align:right}

.checks{list-style:none;padding:.4rem 0}
.checks li{display:grid;grid-template-columns:1.2rem 1fr;gap:.5rem;padding:.5rem 1.1rem;font-size:.9rem;line-height:1.45}
.checks li::before{font-weight:700;text-align:center}
.checks .ok::before{content:"✓";color:var(--ok)}
.checks .warn::before{content:"!";color:var(--warn)}
.checks .err::before{content:"✕";color:var(--err)}
.checks .info::before{content:"i";color:var(--cobalt)}
.about{padding:1rem 1.1rem;color:var(--slate);font-size:.86rem;line-height:1.55;border-top:1px solid var(--line)}
.about p+p{margin-top:.6rem}

.empty{margin-top:1.25rem;padding:2rem 1.25rem;text-align:center;color:var(--slate);border:1px dashed var(--line);border-radius:14px}

footer{padding:2.5rem 0 3rem;color:var(--slate);font-size:.9rem}

@media (max-width:860px){
  .grid2{grid-template-columns:1fr}
  .side{order:-1}
}
@media (max-width:600px){
  .bar .right a{display:none}
  .status{margin-left:0;width:100%;justify-content:center}
  .thead{display:none}
  .row{grid-template-columns:3rem minmax(0,1fr) auto;padding:.8rem .9rem}
  .row .val{grid-column:2 / 4}
  .row .len{grid-row:1;grid-column:3}
  .row.child{padding-left:calc(.9rem + var(--d,1) * .5rem)}
}
@media (prefers-reduced-motion:reduce){.row,.raw .seg{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="home" href="https://rocketflash-net.github.io/it/">Daniel Aldo Pratama</a>
    <div class="right">
      <a href="https://github.com/rocketflash-net/qris-tlv-decoder" target="_blank" rel="noopener">GitHub</a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="id" aria-pressed="false">ID</button>
      </div>
      <button class="toggle" id="theme" type="button" aria-label="Switch light or dark theme">◐</button>
    </div>
  </div>

  <header class="top">
    <h1>QRIS <span>TLV</span> Decoder</h1>
    <p class="lede" data-t="lede"></p>
  </header>

  <div class="card input">
    <label for="q" data-t="inputLabel"></label>
    <textarea id="q" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    <div class="actions">
      <button class="btn solid" type="button" id="sample" data-t="sample"></button>
      <button class="btn" type="button" id="clear" data-t="clear"></button>
      <span class="status" id="status" hidden></span>
    </div>
  </div>

  <div class="empty" id="empty" data-t="empty"></div>

  <div id="out" hidden>
    <dl class="summary" id="summary"></dl>

    <div class="raw">
      <div class="raw-head">
        <span data-t="raw"></span>
        <span class="legend"><span><i style="background:var(--code-key)"></i><span data-t="lgTag"></span></span><span><i style="background:var(--code-num)"></i><span data-t="lgLen"></span></span><span><i style="background:var(--code-ink)"></i><span data-t="lgVal"></span></span></span>
      </div>
      <pre id="raw"></pre>
    </div>

    <div class="grid2">
      <div class="card">
        <h2><span data-t="decoded"></span><button class="btn" type="button" id="copy" data-t="copyJson"></button></h2>
        <div class="thead"><span data-t="colTag"></span><span data-t="colField"></span><span data-t="colValue"></span><span data-t="colLen"></span></div>
        <ul class="rows" id="rows"></ul>
      </div>
      <aside class="card side">
        <h2 data-t="checks"></h2>
        <ul class="checks" id="checks"></ul>
        <div class="about"><p data-t="privacy"></p><p data-t="ref"></p></div>
      </aside>
    </div>
  </div>
</div>

<footer><div class="wrap"><span data-t="by"></span> <a href="https://rocketflash-net.github.io/it/">Daniel Aldo Pratama</a> · <a href="https://github.com/rocketflash-net/qris-tlv-decoder" target="_blank" rel="noopener" data-t="source"></a></div></footer>

<script>
(function(){
  'use strict';

  // ---------- i18n ----------
  var UI = {
    en: {
      lede: 'Paste a QRIS string and every EMV tag is split into tag, length and value, with what each one means. Everything runs in your browser.',
      inputLabel: 'QRIS payload', placeholder: '00020101021126...6304XXXX', sample: 'Try a sample', clear: 'Clear',
      empty: 'Paste a QRIS payload above, or try the sample, to see it decoded.',
      raw: 'Payload', lgTag: 'Tag', lgLen: 'Length', lgVal: 'Value',
      decoded: 'Decoded fields', copyJson: 'Copy JSON', copied: 'Copied',
      colTag: 'Tag', colField: 'Field', colValue: 'Value', colLen: 'Len',
      checks: 'Checks', valid: 'Valid QRIS', invalid: 'Has errors', warnings: 'Valid, with warnings',
      privacy: 'The payload never leaves this page. Nothing is sent to a server or stored.',
      ref: 'Based on the EMVCo Merchant-Presented Mode spec and the ASPI QRIS standard. Use it for learning and debugging, not as an official validator.',
      by: 'Built by', source: 'Source on GitHub',
      sMerchant: 'Merchant', sCity: 'City', sAmount: 'Amount', sType: 'QR type', sNmid: 'NMID', sCrit: 'Criteria',
      static: 'Static', dynamic: 'Dynamic', open: 'Entered by payer'
    },
    id: {
      lede: 'Tempel string QRIS dan setiap tag EMV akan dipecah menjadi tag, panjang dan nilai, lengkap dengan artinya. Semua diproses di browser Anda.',
      inputLabel: 'Payload QRIS', placeholder: '00020101021126...6304XXXX', sample: 'Coba contoh', clear: 'Hapus',
      empty: 'Tempel payload QRIS di atas, atau coba contoh, untuk melihat hasil decode.',
      raw: 'Payload', lgTag: 'Tag', lgLen: 'Panjang', lgVal: 'Nilai',
      decoded: 'Hasil decode', copyJson: 'Salin JSON', copied: 'Tersalin',
      colTag: 'Tag', colField: 'Field', colValue: 'Nilai', colLen: 'Pjg',
      checks: 'Pemeriksaan', valid: 'QRIS valid', invalid: 'Ada error', warnings: 'Valid, ada peringatan',
      privacy: 'Payload tidak pernah keluar dari halaman ini. Tidak ada yang dikirim ke server atau disimpan.',
      ref: 'Mengacu pada spesifikasi EMVCo Merchant-Presented Mode dan standar QRIS ASPI. Gunakan untuk belajar dan debugging, bukan validator resmi.',
      by: 'Dibuat oleh', source: 'Kode sumber di GitHub',
      sMerchant: 'Merchant', sCity: 'Kota', sAmount: 'Nominal', sType: 'Jenis QR', sNmid: 'NMID', sCrit: 'Kriteria',
      static: 'Statis', dynamic: 'Dinamis', open: 'Diisi pembayar'
    }
  };
  var lang = 'en';
  function L(en, id){ return {en: en, id: id}; }
  function tr(x){ return x == null ? '' : (typeof x === 'string' ? x : x[lang]); }
  function u(k){ return UI[lang][k]; }

  // ---------- Reference data ----------
  // Field rules follow Spesifikasi QRIS MPM v1.9 (ASPI), table 3.1.
  var NETWORKS = {2:'Visa',3:'Visa',4:'Mastercard',5:'Mastercard',9:'Discover',10:'Discover',11:'American Express',12:'American Express',13:'JCB',14:'JCB',15:'UnionPay',16:'UnionPay'};
  var CURRENCY = {'360':'IDR, Indonesian rupiah','702':'SGD, Singapore dollar','458':'MYR, Malaysian ringgit','764':'THB, Thai baht','392':'JPY, Japanese yen','608':'PHP, Philippine peso','840':'USD, US dollar','156':'CNY, Chinese yuan','410':'KRW, Korean won'};
  var COUNTRY = {ID:'Indonesia',SG:'Singapore',MY:'Malaysia',TH:'Thailand',JP:'Japan',PH:'Philippines',US:'United States',CN:'China',KR:'South Korea'};
  var MCC = {
    '4111':'Commuter transport','4121':'Taxis and limousines','4789':'Transportation services','4814':'Telecommunication services','4829':'Money transfer','4900':'Utilities',
    '5200':'Home supply stores','5251':'Hardware stores','5300':'Wholesale clubs','5310':'Discount stores','5311':'Department stores','5331':'Variety stores','5399':'General merchandise',
    '5411':'Grocery stores and supermarkets','5441':'Candy and confectionery stores','5462':'Bakeries','5499':'Miscellaneous food stores',
    '5541':'Service stations','5651':'Family clothing stores','5691':'Clothing stores','5732':'Electronics stores',
    '5812':'Restaurants','5813':'Bars and lounges','5814':'Fast food restaurants','5912':'Drug stores and pharmacies',
    '5942':'Book stores','5945':'Toy and game stores','5977':'Cosmetic stores','5999':'Miscellaneous retail',
    '6011':'Cash disbursement (ATM)','6012':'Financial institutions','6540':'Stored value card load',
    '7011':'Hotels and lodging','7230':'Beauty and barber shops','7299':'Personal services','7399':'Business services',
    '7832':'Cinemas','7997':'Clubs and recreation','8011':'Doctors','8062':'Hospitals','8099':'Health services',
    '8211':'Schools','8220':'Colleges and universities','8398':'Charitable organisations','8661':'Religious organisations','9399':'Government services'
  };
  var CRITERIA = {
    UMI: L('Micro business (Usaha Mikro)','Usaha Mikro'),
    UKE: L('Small business (Usaha Kecil)','Usaha Kecil'),
    UME: L('Medium business (Usaha Menengah)','Usaha Menengah'),
    UBE: L('Large business (Usaha Besar)','Usaha Besar'),
    URE: L('Regular business, used when the size is not yet known (Usaha Reguler)','Usaha Reguler, dipakai jika skala usaha belum diketahui'),
    BLU: L('Public service agency (Badan Layanan Umum)','Badan Layanan Umum'),
    PSO: L('Public Service Obligation','Public Service Obligation')
  };
  var SOF = {'0':L('unspecified','tidak ditentukan'), '1':L('debit or savings','debit/rekening simpanan'), '2':L('credit','kredit'), '3':L('e-money','uang elektronik')};
  var PURPOSE = {POSP:'Payment Credit QRIS', BILL:'Billing Payment'};
  var ASK = L('*** means the app asks the payer to fill this in.','*** berarti aplikasi meminta pembayar mengisinya.');
  var GUID = function(v){
    if (v === 'ID.CO.QRIS.WWW') return L('National Merchant Repository (QRIS).','National Merchant Repository (QRIS).');
    if (v === '00') return L('Default value.','Nilai default.');
    return null;
  };

  function money(v, cur){
    if (!/^\d+(\.\d*)?$/.test(v)) return null;
    var parts = v.split('.');
    var whole = parts[0].replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, lang === 'id' ? '.' : ',');
    var frac = parts[1] ? (lang === 'id' ? ',' : '.') + parts[1] : '';
    var code = cur === '360' || !cur ? 'Rp' : ((CURRENCY[cur] || '').split(',')[0] || '');
    return (code + ' ' + whole + frac).trim();
  }

  function pan(v){
    if (!/^\d{9}/.test(v)) return null;
    var s = SOF[v[8]];
    return 'NNS ' + v.slice(0, 8) + ' · SOF ' + v[8] + ' (' + (s ? tr(s) : 'RFU') + ')';
  }

  // Root-level tags. Each returns {name, desc, explain?, tpl?, soft?, fixed?, max?, min?, num?}.
  // tpl names the sub-tag dictionary; soft templates fall back to a raw value without a warning.
  function rootDef(tag, ctx){
    var n = +tag;
    switch (tag) {
      case '00': return {name:'Payload Format Indicator', desc:L('Version of the QR data format.','Versi format data QR.'), fixed:2, num:true,
        explain:function(v){ return v === '01' ? L('Version 01, as required.','Versi 01, sesuai standar.') : L('Must be 01.','Harus 01.'); }};
      case '01': return {name:'Point of Initiation Method', desc:L('Whether the QR is static or dynamic. Either kind may or may not carry an amount.','Jenis QR: statis atau dinamis. Keduanya boleh berisi nominal atau tidak.'), fixed:2, num:true,
        explain:function(v){
          if (v === '11') return L('Static: the same QR is shown for every transaction.','Statis: QR yang sama ditampilkan untuk setiap transaksi.');
          if (v === '12') return L('Dynamic: a new QR is shown for each transaction.','Dinamis: QR berbeda ditampilkan untuk setiap transaksi.');
          return L('Unknown value. Expected 11 or 12.','Nilai tidak dikenal. Seharusnya 11 atau 12.');
        }};
      case '40': return {name:'Transfer Account Information', desc:L('Used for QRIS transfer, cash withdrawal and deposit (separate spec).','Dipakai untuk QRIS Transfer, Tarik Tunai dan Setor Tunai (spesifikasi terpisah).'), tpl:'xfer', max:99};
      case '51': return {name:'Merchant Account Information, Domestic Central Repository', desc:L('Merchant registration in the National Merchant Repository. Mandatory.','Data merchant di National Merchant Repository. Wajib ada.'), tpl:'nmr', max:99};
      case '52': return {name:'Merchant Category Code', desc:L('ISO 18245 code for the type of business.','Kode ISO 18245 untuk jenis usaha.'), fixed:4, num:true,
        explain:function(v){ return MCC[v] || null; }};

      if (tag === '01') return {name:'Merchant PAN', desc:L('8-digit NNS, 1-digit source of funds, then the merchant sequence. Used to route to the acquirer.','8 digit NNS, 1 digit sumber dana, lalu nomor urut merchant. Dipakai untuk routing ke acquirer.'), num:true, min:16, max:19, explain:pan};

        explain:function(v){ return CRITERIA[v] || null; }};

      if (tag === '02') return {name:'National Merchant ID (NMID)', desc:L('Issued by the National Merchant Repository, e.g. ID1019123456781.','Diterbitkan oleh National Merchant Repository, contoh ID1019123456781.'), max:15};

    }

      if (tag === '02') return {name:'Beneficiary ID', desc:L('ID of the receiving account.','ID rekening penerima.'), max:15};

        '01':L('Invoice or bill number.','Nomor invoice atau tagihan.'),
        '02':L('Customer phone number.','Nomor telepon pelanggan.'),
        '03':L('Store or outlet identifier.','Identitas toko atau outlet.'),
        '04':L('Loyalty number.','Nomor loyalti.'),
        '05':L('Any value set by the merchant or acquirer to identify the transaction.','Nilai dari merchant atau acquirer untuk mengidentifikasi transaksi.'),
        '06':L('Customer identifier.','Identitas pelanggan.'),
        '07':L('Terminal ID, usually from NMR registration.','ID terminal, biasanya dari pendaftaran NMR.')
      };
      if (names[tag]) return {name:names[tag], desc:descs[tag], max:25, explain:function(v){ return v === '***' ? ASK : null; }};
      if (tag === '08') return {name:'Purpose of Transaction', desc:L('Type of transaction. Mandatory when tag 62 is present.','Jenis transaksi. Wajib jika tag 62 ada.'), max:25,
        explain:function(v){ return PURPOSE[v] || null; }};
      if (tag === '09') return {name:'Additional Consumer Data Request', desc:L('Data the payer must provide: A address, M mobile, E email.','Data yang wajib diisi pembayar: A alamat, M ponsel, E email.'), max:3,
        explain:function(v){
          var m = {A:L('address','alamat'), M:L('mobile number','nomor ponsel'), E:L('email','email')};
          return (lang === 'id' ? 'Minta: ' : 'Ask for: ') + v.split('').map(function(c){ return m[c] ? tr(m[c]) : c; }).join(', ');
        }};
      if (tag === '10') return {name:'Merchant Tax ID', desc:L('Merchant tax number (NPWP).','NPWP merchant.'), max:20};
      if (tag === '11') return {name:'Merchant Channel', desc:L('Media, location and presence of the QR.','Media, lokasi dan kehadiran QR.'), fixed:3,
        explain:function(v){ return channel(v); }};

      if (n >= 50 && n <= 98) return {name:'Payment System Specific', desc:L('Not used in QRIS v1.9.','Tidak digunakan di QRIS v1.9.')};
      return {name:'Proprietary Data', desc:L('Template with a GUID (00) and proprietary data (01).','Template berisi GUID (00) dan data proprietary (01).'), tpl:'prop', max:95};
    }
    if (tpl === 'prop') {
      if (tag === '00') return {name:'Globally Unique Identifier', desc:L('Owner of the proprietary data.','Pemilik data proprietary.'), max:32};
      if (tag === '01') return {name:'Proprietary Data', desc:L('Data defined by the owner.','Data yang ditentukan pemiliknya.'), max:81};

      if (tag === '00') return {name:'Language Preference', desc:L('ISO 639 two-letter language code.','Kode bahasa ISO 639, dua huruf.'), fixed:2};
      if (tag === '01') return {name:'Merchant Name, Alternate Language', desc:L('Merchant name in that language. Mandatory.','Nama merchant dalam bahasa tersebut. Wajib.'), max:25};
      if (tag === '02') return {name:'Merchant City, Alternate Language', desc:L('Merchant city in that language.','Kota merchant dalam bahasa tersebut.'), max:15};

    }

  function channel(v){
    if (!/^\d{3}$/.test(v)) return null;
    var media = [L('printed merchant sticker','stiker merchant cetak'), L('printed bill or invoice','struk atau invoice cetak'), L('printed magazine or poster','majalah atau poster cetak'), L('other print','cetak lainnya'),
                 L('merchant POS screen','layar POS merchant'), L('website','situs web'), L('app','aplikasi'), L('other screen','layar lainnya')];
    var loc = [L('at the merchant','di lokasi merchant'), L('away from the merchant','di luar lokasi merchant'), L('remote commerce','transaksi jarak jauh'), L('other location','lokasi lainnya')];
    var pres = [L('attended','dilayani'), L('unattended','tanpa petugas'), L('semi-attended (self-checkout)','semi-dilayani (self-checkout)'), L('other','lainnya')];
    var a = media[+v[0]], b = loc[+v[1]], c = pres[+v[2]];
    if (!a || !b || !c) return null;
    return tr(a) + ', ' + tr(b) + ', ' + tr(c);
  }

  // ---------- Parsing ----------
  function parse(s, base){
    var items = [], errs = [], i = 0;
    while (i < s.length) {
      if (s.length - i < 4) { errs.push({code:'trail', pos:base + i, rest:s.slice(i)}); break; }
      var tag = s.substr(i, 2), ls = s.substr(i + 2, 2);
      if (!/^\d\d$/.test(tag) || !/^\d\d$/.test(ls)) { errs.push({code:'format', pos:base + i, rest:s.slice(i)}); break; }
      var len = +ls, value = s.substr(i + 4, len);
      var item = {tag:tag, len:len, value:value, start:base + i};
      items.push(item);
      if (value.length < len) { item.short = true; errs.push({code:'short', pos:base + i, tag:tag, len:len, got:value.length}); break; }
      i += 4 + len;
    }
    return {items:items, errs:errs};
  }

  // Some generators write a value longer than 99 and keep only the last two
  // digits of its length (109 becomes "09"). If the strict parse fails, try
  // len + 100, len + 200... and accept it only when the rest of the payload
  // then parses cleanly through to tag 63.
  function parseRoot(s){
    var strict = parse(s, 0);
    if (!strict.errs.length) return strict;
    // Work back from the failure point: the overflowing tag is usually just before it
    for (var idx = strict.items.length - 1; idx >= 0; idx--) {
      var it = strict.items[idx], from = it.start + 4, def = rootDef(it.tag, {});
      if (def.fixed || (def.max && def.max < 99)) continue;
      for (var len = it.len + 100; from + len <= s.length; len += 100) {
        var rest = parse(s.slice(from + len), from + len);
        var last = rest.items[rest.items.length - 1];
        if (rest.errs.length || !last || last.tag !== '63') continue;
        var value = s.substr(from, len);
        if (def.tpl && parse(value, from).errs.length) continue;
        var fixed = {tag:it.tag, len:len, value:value, start:it.start, declared:it.len};
        return {items:strict.items.slice(0, idx).concat([fixed], rest.items), errs:[]};
      }
    }
    return strict;
  }

  function crc16(str){
    var bytes = new TextEncoder().encode(str), crc = 0xFFFF;
    for (var i = 0; i < bytes.length; i++) {
      crc ^= bytes[i] << 8;
      for (var j = 0; j < 8; j++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
    }
    return ('000' + crc.toString(16).toUpperCase()).slice(-4);
  }

  function defOf(it, parent, ctx){ return parent ? subDef(parent.tpl, parent.tag, it.tag) : rootDef(it.tag, ctx); }
  function child(it, tag){ return it && it.children ? it.children.filter(function(c){ return c.tag === tag; })[0] : null; }

  function decode(s){
    var res = parseRoot(s), ctx = {}, checks = [];
    function add(lv, en, id){ checks.push({lv:lv, msg:L(en, id)}); }
    res.items.forEach(function(it){ if (!(it.tag in ctx)) ctx[it.tag] = it.value; });
    var byTag = {};
    res.items.forEach(function(it){ if (!byTag[it.tag]) byTag[it.tag] = it; });

    res.errs.forEach(function(e){
      if (e.code === 'format') add('err', 'Invalid tag or length at position ' + (e.pos + 1) + '.', 'Tag atau panjang tidak valid di posisi ' + (e.pos + 1) + '.');
      if (e.code === 'short') add('err', 'Tag ' + e.tag + ' declares ' + e.len + ' characters but only ' + e.got + ' remain.', 'Tag ' + e.tag + ' menyatakan ' + e.len + ' karakter tapi hanya tersisa ' + e.got + '.');
      if (e.code === 'trail') add('err', 'Leftover characters at the end: "' + e.rest + '".', 'Ada sisa karakter di akhir: "' + e.rest + '".');
    });

    res.items.forEach(function(it){
      if (it.declared == null) return;
      var d = ('0' + it.declared).slice(-2);
      add('err',
        'Tag ' + it.tag + ' has length "' + d + '", but its value is ' + it.len + ' characters. Lengths are two digits, 01 to 99 (spec 3.2.4), so the generator likely kept only the last two digits. Decoded using the actual length; strict scanners may reject this QR.',
        'Panjang tag ' + it.tag + ' tertulis "' + d + '", padahal nilainya ' + it.len + ' karakter. Panjang wajib 2 digit, 01 sampai 99 (spesifikasi 3.2.4), jadi generator kemungkinan hanya menulis 2 digit terakhir. Di-decode dengan panjang sebenarnya; scanner yang ketat bisa menolak QR ini.');
    });

    // Expand templates, recursing into nested ones such as 62 > 99
    function expand(it, def){

      if (sub.errs.length || !sub.items.length) {
        if (!def.soft) add('warn', 'Tag ' + it.tag + ' should be a template, but its contents could not be split into sub-tags.', 'Tag ' + it.tag + ' seharusnya template, tapi isinya tidak bisa dipecah menjadi sub-tag.');
        return;

      it.tpl = def.tpl;
      it.children.forEach(function(c){ expand(c, subDef(it.tpl, it.tag, c.tag)); });

    res.items.forEach(function(it){ expand(it, rootDef(it.tag, ctx)); });

    // Per-field rules: duplicates, fixed and maximum lengths, numeric format

      var seen = {};
      items.forEach(function(it){
        var def = defOf(it, parent, ctx), label = prefix + it.tag;
        if (seen[it.tag]) add('err', 'Tag ' + label + ' appears more than once.', 'Tag ' + label + ' muncul lebih dari sekali.');
        seen[it.tag] = true;
        if (it.declared == null && !it.short) {

          if (def.max && it.len > def.max) add('warn', 'Tag ' + label + ' is ' + it.len + ' characters; the spec allows up to ' + def.max + '.', 'Tag ' + label + ' berisi ' + it.len + ' karakter; spesifikasi maksimal ' + def.max + '.');
          if (def.min && it.len < def.min) add('warn', 'Tag ' + label + ' is ' + it.len + ' characters; the spec expects at least ' + def.min + '.', 'Tag ' + label + ' berisi ' + it.len + ' karakter; spesifikasi minimal ' + def.min + '.');
          if (def.num && !/^\d+$/.test(it.value)) add('err', 'Tag ' + label + ' must contain digits only.', 'Tag ' + label + ' hanya boleh berisi angka.');
        }
        if (it.children) walk(it.children, it, label + '.');
      });
    }
    walk(res.items, null, '');

    // CRC
    var crcItem = byTag['63'];
    if (crcItem) {
      if (res.items[res.items.length - 1] !== crcItem) add('err', 'Tag 63 (CRC) must be the last field.', 'Tag 63 (CRC) harus menjadi field terakhir.');
      if (crcItem.len === 4) {
        var calc = crc16(s.slice(0, crcItem.start + 4));
        if (calc === crcItem.value.toUpperCase()) {
          ctx.crcNote = L('Matches the computed CRC.','Cocok dengan CRC hasil hitung.');
          add('ok', 'CRC is valid (' + calc + ').', 'CRC valid (' + calc + ').');
        } else {
          ctx.crcNote = L('Does not match. Computed: ' + calc + '.','Tidak cocok. Hasil hitung: ' + calc + '.');
          add('err', 'CRC mismatch: payload has ' + crcItem.value + ', computed ' + calc + '.', 'CRC tidak cocok: tertulis ' + crcItem.value + ', hasil hitung ' + calc + '.');
        }
      }
    }

    // Structure and mandatory tags (spec 3.2.6 and section 4)
    if (res.items.length && res.items[0].tag !== '00') add('err', 'Tag 00 must be the first field.', 'Tag 00 harus menjadi field pertama.');
    else if (ctx['00'] && ctx['00'] !== '01') add('err', 'Tag 00 must be "01".', 'Tag 00 harus "01".');
    if (!res.errs.length) {
      var required = ['00','51','52','53','58','59','60','62','63'];
      if (ctx['58'] === 'ID' || !('58' in ctx)) required.splice(7, 0, '61');
      required.forEach(function(t){
        if (!(t in ctx)) add('err', 'Mandatory tag ' + t + ' (' + rootDef(t, ctx).name + ') is missing.', 'Tag wajib ' + t + ' (' + rootDef(t, ctx).name + ') tidak ada.');
      });
    }
    if (ctx['58'] === 'ID' && '53' in ctx && ctx['53'] !== '360') add('err', 'Currency must be 360 (IDR) when the country is ID.', 'Mata uang wajib 360 (IDR) jika negara ID.');

    // Merchant account templates
    res.items.forEach(function(it){
      var n = +it.tag;
      if (n >= 26 && n <= 35 && it.children) ['00','01','02','03'].forEach(function(t){
        if (!child(it, t)) add('err', 'Tag ' + it.tag + ' is missing mandatory sub-tag ' + t + ' (' + subDef('mai', it.tag, t).name + ').', 'Tag ' + it.tag + ' tidak memiliki sub-tag wajib ' + t + ' (' + subDef('mai', it.tag, t).name + ').');
      });

    if ('54' in ctx && !/^\d+(\.\d*)?$/.test(ctx['54'])) add('err', 'Amount must be digits with an optional "." decimal point and no thousands separator (e.g. 10000 or 10000.00).', 'Nominal harus angka dengan desimal "." opsional, tanpa pemisah ribuan (contoh 10000 atau 10000.00).');

    if ('57' in ctx && !/^\d+(\.\d*)?$/.test(ctx['57'])) add('err', 'Tag 57 must be a number from 00.01 to 99.99, without "%".', 'Tag 57 harus angka 00.01 sampai 99.99, tanpa "%".');
    if ('55' in ctx && ['01','02','03'].indexOf(ctx['55']) < 0) add('warn', 'Tag 55 should be 01, 02 or 03.', 'Tag 55 seharusnya 01, 02 atau 03.');
    if (ctx['55'] === '02' && !('56' in ctx)) add('err', 'Tag 55 is 02 but the fixed tip (tag 56) is missing.', 'Tag 55 bernilai 02 tapi tip tetap (tag 56) tidak ada.');
    if (ctx['55'] === '03' && !('57' in ctx)) add('err', 'Tag 55 is 03 but the tip percentage (tag 57) is missing.', 'Tag 55 bernilai 03 tapi persentase tip (tag 57) tidak ada.');
    if ('56' in ctx && ctx['55'] !== '02') add('warn', 'Tag 56 is only used when tag 55 is 02.', 'Tag 56 hanya dipakai jika tag 55 bernilai 02.');
    if ('57' in ctx && ctx['55'] !== '03') add('warn', 'Tag 57 is only used when tag 55 is 03.', 'Tag 57 hanya dipakai jika tag 55 bernilai 03.');

    // Additional data (tag 62)
    var adf = byTag['62'];
    if (adf && adf.children) {
      var p = child(adf, '08');
      if (!p) add('err', 'Tag 62 is missing sub-tag 08 (Purpose of Transaction), which is mandatory.', 'Tag 62 tidak memiliki sub-tag 08 (Purpose of Transaction) yang wajib ada.');
      else if (!PURPOSE[p.value]) add('warn', 'Purpose of Transaction is "' + p.value + '". Table 3.9 defines POSP and BILL.', 'Purpose of Transaction bernilai "' + p.value + '". Tabel 3.9 hanya mendefinisikan POSP dan BILL.');
      var unused = adf.children.filter(function(c){ var n = +c.tag; return n >= 12 && n <= 98; }).map(function(c){ return '62.' + c.tag; });
      if (unused.length) add('warn', unused.join(', ') + ': sub-tags 12 to 98 are not used in QRIS v1.9.', unused.join(', ') + ': sub-tag 12 sampai 98 tidak digunakan di QRIS v1.9.');
      var req = child(adf, '09');
      if (req && (!/^[AME]+$/.test(req.value) || /(.).*\1/.test(req.value))) add('err', 'Tag 62.09 may only contain A, M and E, each at most once.', 'Tag 62.09 hanya boleh berisi A, M dan E, masing-masing maksimal sekali.');
      var prop = child(adf, '99');
      if (prop && prop.children && (!child(prop, '00') || !child(prop, '01'))) add('err', 'Tag 62.99 must contain sub-tags 00 and 01.', 'Tag 62.99 wajib berisi sub-tag 00 dan 01.');
    }

    // Language template (tag 64)
    var lt = byTag['64'];
    if (lt && lt.children && (!child(lt, '00') || !child(lt, '01'))) add('err', 'Tag 64 must contain sub-tags 00 (language) and 01 (merchant name).', 'Tag 64 wajib berisi sub-tag 00 (bahasa) dan 01 (nama merchant).');

    var rest = res.errs.length && res.errs[0].rest ? res.errs[0].rest : '';
    return {items:res.items, ctx:ctx, checks:checks, rest:rest, nmr:nmr};
  }

  // ---------- Rendering ----------
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function rawHTML(items, prefix, sub){
    return items.map(function(it, k){
      var id = prefix + k;
      var inner = it.children ? rawHTML(it.children, id + '.', true) : esc(it.value);
      return '<span class="seg' + (sub ? ' sub' : '') + '" data-i="' + id + '"><span class="t">' + it.tag + '</span><span class="l' + (it.declared != null ? ' over' : '') + '">' + ('0' + it.len).slice(-2) + '</span>' + inner + '</span>';
    }).join('');
  }

  function rowsHTML(items, parent, ctx, idPrefix, tagPrefix, depth){
    return items.map(function(it, k){
      var def = defOf(it, parent, ctx), id = idPrefix + k;
      var m = def.explain ? def.explain(it.value) : null;
      var tag = tagPrefix ? '<span>' + tagPrefix + '</span><b>' + it.tag + '</b>' : it.tag;
      var row = '<li class="row' + (depth ? ' child' : '') + (it.short || it.declared != null ? ' flag' : '') + '" data-i="' + id + '"' + (depth ? ' style="--d:' + depth + '"' : '') + '>' +
        '<span class="tag">' + tag + '</span>' +
        '<span class="name">' + esc(def.name) + '<span class="desc">' + esc(tr(def.desc)) + '</span>' + (m ? '<span class="meaning">' + esc(tr(m)) + '</span>' : '') + '</span>' +
        '<span class="val">' + (it.children ? '<span style="color:var(--slate)">' + it.children.length + (lang === 'id' ? ' sub-tag' : ' sub-tags') + '</span>' : esc(it.value)) + '</span>' +
        '<span class="len">' + it.len + (it.declared != null ? '<small>(' + ('0' + it.declared).slice(-2) + ')</small>' : '') + '</span></li>';
      return row + (it.children ? rowsHTML(it.children, it, ctx, id + '.', tagPrefix + it.tag + '.', depth + 1) : '');
    }).join('');
  }

  function toJSON(d){
    function map(items, parent){
      return items.map(function(it){
        var def = defOf(it, parent, d.ctx);
        var m = def.explain ? def.explain(it.value) : null;
        var o = {tag:it.tag, name:def.name, length:it.len, value:it.value};
        if (it.declared != null) o.declaredLength = it.declared;
        if (m) o.meaning = tr(m);
        if (it.children) o.children = map(it.children, it);
        return o;
      });
    }
    return JSON.stringify(map(d.items, null), null, 2);
  }

  var $ = function(id){ return document.getElementById(id); };
  var q = $('q'), current = null;

  function render(){
    var s = q.value.replace(/[\r\n]+/g, '').trim();
    if (!s) { $('out').hidden = true; $('empty').hidden = false; $('status').hidden = true; current = null; return; }
    var d = decode(s);
    current = d;
    $('out').hidden = false; $('empty').hidden = true;

    // Status
    var errs = d.checks.filter(function(c){ return c.lv === 'err'; }).length;
    var warns = d.checks.filter(function(c){ return c.lv === 'warn'; }).length;
    var st = $('status');
    st.hidden = false;
    st.className = 'status ' + (errs ? 'err' : warns ? 'warn' : 'ok');
    st.textContent = errs ? u('invalid') + ' (' + errs + ')' : warns ? u('warnings') : u('valid');

    // Summary
    var c = d.ctx, sum = [];
    if (c['59']) sum.push([u('sMerchant'), c['59']]);
    if (c['60']) sum.push([u('sCity'), c['60']]);
    if (c['01']) sum.push([u('sType'), c['01'] === '12' ? u('dynamic') : c['01'] === '11' ? u('static') : c['01']]);
    sum.push([u('sAmount'), c['54'] ? (money(c['54'], c['53']) || c['54']) : u('open')]);
    var nmid = child(d.nmr, '02');
    if (nmid) sum.push([u('sNmid'), nmid.value]);
    var crit = null;
    d.items.forEach(function(it){ var n = +it.tag; if (!crit && n >= 26 && n <= 35) crit = child(it, '03'); });
    if (crit) sum.push([u('sCrit'), crit.value]);
    $('summary').innerHTML = sum.map(function(p){ return '<div><dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd></div>'; }).join('');

    // Raw
    $('raw').innerHTML = rawHTML(d.items, '', false) + (d.rest ? '<span class="bad">' + esc(d.rest) + '</span>' : '');

    // Rows
    $('rows').innerHTML = rowsHTML(d.items, null, d.ctx, '', '', 0);

    // Checks: errors first
    var order = {err:0, warn:1, info:2, ok:3};
    $('checks').innerHTML = d.checks.slice().sort(function(a, b){ return order[a.lv] - order[b.lv]; })
      .map(function(ch){ return '<li class="' + ch.lv + '">' + esc(tr(ch.msg)) + '</li>'; }).join('');
  }

  // Link hover between the raw payload and the field rows
  var hot = null;
  function setHot(id){
    if (hot === id) return;
    document.querySelectorAll('.hl').forEach(function(el){ el.classList.remove('hl'); });
    hot = id;
    if (id != null) document.querySelectorAll('[data-i="' + id + '"]').forEach(function(el){ el.classList.add('hl'); });
  }
  ['raw', 'rows'].forEach(function(box){
    $(box).addEventListener('mouseover', function(e){ var el = e.target.closest('[data-i]'); setHot(el ? el.getAttribute('data-i') : null); });
    $(box).addEventListener('mouseleave', function(){ setHot(null); });
  });
  $('raw').addEventListener('click', function(e){
    var el = e.target.closest('[data-i]');
    var row = el && document.querySelector('.row[data-i="' + el.getAttribute('data-i') + '"]');
    if (row) row.scrollIntoView({behavior:'smooth', block:'center'});
  });

  // ---------- Sample (fictional merchant) ----------
  function tlv(tag, v){ return tag + ('0' + v.length).slice(-2) + v; }
  function sample(){
    var p = tlv('00', '01') + tlv('01', '12') +
      tlv('26', tlv('00', 'ID.CO.CONTOHPAY.WWW') + tlv('01', '936099990000012345') + tlv('02', '000000012345') + tlv('03', 'UMI')) +
      tlv('51', tlv('00', 'ID.CO.QRIS.WWW') + tlv('02', 'ID1026000000001')) +
      tlv('52', '5812') + tlv('53', '360') + tlv('54', '25000') + tlv('58', 'ID') +
      tlv('59', 'WARUNG CONTOH') + tlv('60', 'JAKARTA SELATAN') + tlv('61', '12190') +
      tlv('62', tlv('01', 'INV-0001') + tlv('07', 'KASIR01') + tlv('08', 'POSP') + tlv('11', '400')) + '6304';
    return p + crc16(p);
  }

  // ---------- Wiring ----------
  function applyLang(l){
    lang = l;
    document.documentElement.lang = l;
    document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = u(el.getAttribute('data-t')); });
    q.placeholder = u('placeholder');
    document.querySelectorAll('.lang button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === l)); });
    try { localStorage.setItem('qris-lang', l); } catch (e) {}
    render();
  }
  document.querySelectorAll('.lang button').forEach(function(b){
    b.addEventListener('click', function(){ applyLang(b.getAttribute('data-lang')); });
  });

  var root = document.documentElement;
  try { var t = localStorage.getItem('theme'); if (t) root.setAttribute('data-theme', t); } catch (e) {}
  $('theme').addEventListener('click', function(){
    var cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });

  q.addEventListener('input', render);
  $('sample').addEventListener('click', function(){ q.value = sample(); render(); });
  $('clear').addEventListener('click', function(){ q.value = ''; render(); q.focus(); });
  $('copy').addEventListener('click', function(){
    if (!current) return;
    var btn = this;
    navigator.clipboard.writeText(toJSON(current)).then(function(){
      btn.textContent = u('copied');
      setTimeout(function(){ btn.textContent = u('copyJson'); }, 1400);
    }, function(){});
  });

  var saved = null;
  try { saved = localStorage.getItem('qris-lang'); } catch (e) {}
  applyLang(saved || ((navigator.language || '').toLowerCase().indexOf('id') === 0 ? 'id' : 'en'));
})();
</script>
</body>
</html>
